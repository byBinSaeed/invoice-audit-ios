name: build-ios-unsigned
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-14
    steps:
      - run: echo "" | base64 -d | tar xz
      - run: xcodebuild -project InvoiceAudit.xcodeproj -scheme InvoiceAudit -configuration Release -sdk iphoneos -destination generic/platform=iOS -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - run: mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/InvoiceAudit.app Payload/ && zip -qry InvoiceAudit-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: InvoiceAudit-unsigned-ipa
          path: InvoiceAudit-unsigned.ipa
