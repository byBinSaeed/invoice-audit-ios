#!/bin/bash
# يبني IPA غير موقّع على جهاز Mac (Xcode 15+) لتوقيعه لاحقاً بشهادتك
set -e
cd "$(dirname "$0")"
rm -rf build Payload InvoiceAudit-unsigned.ipa
xcodebuild -project InvoiceAudit.xcodeproj -scheme InvoiceAudit -configuration Release \
  -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
  CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/InvoiceAudit.app Payload/
zip -qry InvoiceAudit-unsigned.ipa Payload && rm -rf Payload
echo "تم: InvoiceAudit-unsigned.ipa"
